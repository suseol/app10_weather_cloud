publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  record: ^6.2.1
  path_provider: ^2.1.5
  http: ^1.5.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  exif: ^3.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/weather/
dev_dependencies:
  flutter_lints: ^6.0.0
